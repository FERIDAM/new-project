<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="google.css">
</head>
<body>
    <div class="main">
        <div class="left">
            <img src="/media/Google__G__logo.svg (1).png" alt="google" class="google-logo">
            <h1 class="sign-in">Sign In</h1>
            <p class="use">Use your Google Account</p>
        </div>
        <div class="right">
            <input type="text" name="email or phone" id="email" placeholder="Email or Phone number"> <br>
            <a href="" class="forgot">Forgot email?</a>
            <p class="not">Not your computer? Use guest mode to sign in privately.</p>
            <a href="" class="learn">Learn more about Guest Mode</a>
            <div class="buttons">
                <button class="create">Create Account</button>
                <button class="next">Next</button>
            </div>
        </div>
    </div>
</body>
</html>
